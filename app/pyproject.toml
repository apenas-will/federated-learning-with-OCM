[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-queue-router"
version = "1.0.0"
description = "Federated LoRA fine-tuning of a small LLM that routes bank customer messages to support queues"
license = "Apache-2.0"
# Versions match the SuperExec image (app/Containerfile). flwr is pinned to the
# newest release whose CLI still matches the OCM controller and flower-addon.
dependencies = [
  "flwr==1.34.0",
  "torch==2.14.1",
  "transformers==5.19.0",
  "peft==0.21.2",
  "safetensors",
]

[tool.hatch.build.targets.wheel]
packages = ["bank_router"]

[tool.flwr.app]
publisher = "ocm-demo"

[tool.flwr.app.components]
serverapp = "bank_router.server_app:app"
clientapp = "bank_router.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
min-nodes = 3          # wait for all three branches
local-steps = 25       # optimizer steps per branch per round
batch-size = 4
learning-rate = 0.0005
lora-r = 8
num-threads = 3        # CPU threads per ClientApp (the branches share the same machine)
device = "auto"        # auto = cuda if the ClientApp sees a GPU, else cpu
# Same in-cluster DNS name in every branch cluster; it resolves to that cluster's own data service.
data-endpoint = "http://branch-data.bank-data.svc.cluster.local:8000"
